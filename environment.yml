name: ocsr
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - pip:
      # --- PyTorch (CUDA 13.2 빌드) ---
      - --extra-index-url https://download.pytorch.org/whl/cu132
      - torch==2.15.0
      - torchvision==0.29.2
      # --- 화학정보학: 데이터셋 제작과 채점기 검증에 사용한 버전으로 고정 ---
      - rdkit==2026.9.2
      # --- 데이터 처리와 시각화 ---
      - numpy==2.5.5
      - pandas==3.1.1
      - pillow==13.0.0
      - matplotlib==3.11.2
      - scikit-learn==1.9.1
      - tqdm==4.70.1
      # --- 사전학습 가중치 불러오기 (범용 가중치만 허용) ---
      - timm==1.0.31
      - transformers==5.23.0
      # --- 노트북 커널 ---
      - ipykernel==7.4.0